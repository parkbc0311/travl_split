<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="여행정산" />
<title>여행 정산</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0f0f11;
    --surface: #1a1a1f;
    --surface2: #222228;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0eff4;
    --muted: #8887a0;
    --faint: #444356;
    --accent: #7c6cfa;
    --accent-light: #a99cf8;
    --accent-bg: rgba(124,108,250,0.12);
    --green: #3dd68c;
    --green-bg: rgba(61,214,140,0.1);
    --red: #f26c6c;
    --red-bg: rgba(242,108,108,0.1);
    --amber: #f5a623;
    --amber-bg: rgba(245,166,35,0.1);
    --radius: 14px;
    --radius-sm: 8px;
    --font: 'Noto Sans KR', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { display: flex; flex-direction: column; max-width: 440px; margin: 0 auto; min-height: 100dvh; }

  .app-header { padding: 52px 20px 16px; background: linear-gradient(180deg,#0f0f11 60%,transparent); position: sticky; top: 0; z-index: 10; }
  .app-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .app-header h1 span { color: var(--accent-light); }
  .header-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

  .tabs { display: flex; gap: 4px; background: var(--surface); border-radius: 12px; padding: 4px; margin: 0 20px 20px; border: 0.5px solid var(--border); }
  .tab { flex: 1; text-align: center; padding: 8px 4px; font-size: 12px; font-weight: 500; font-family: var(--font); border-radius: 9px; cursor: pointer; color: var(--muted); border: none; background: none; transition: all 0.18s; }
  .tab.active { background: var(--surface2); color: var(--text); border: 0.5px solid var(--border2); }

  .scroll-area { flex: 1; overflow-y: auto; padding: 0 20px 120px; }
  .scroll-area::-webkit-scrollbar { display: none; }

  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .card-title { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; }

  .members-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; min-height: 32px; }
  .chip { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 20px; padding: 5px 10px 5px 6px; font-size: 13px; color: var(--text); }
  .chip-avatar { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
  .chip-remove { background: none; border: none; cursor: pointer; color: var(--faint); font-size: 16px; line-height: 1; padding: 0 0 0 2px; }
  .chip-remove:hover { color: var(--red); }

  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; }

  input, select { width: 100%; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; font-family: var(--font); color: var(--text); outline: none; transition: border-color 0.15s; -webkit-appearance: none; appearance: none; }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--faint); }
  input:disabled { opacity: 0.4; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .form-single { margin-bottom: 10px; }
  .form-label { font-size: 11px; color: var(--muted); margin-bottom: 5px; display: block; }

  button { cursor: pointer; font-family: var(--font); }
  .btn-primary { width: 100%; padding: 12px; margin-top: 4px; background: var(--accent); border: none; color: #fff; font-size: 14px; font-weight: 500; border-radius: var(--radius-sm); transition: opacity 0.15s, transform 0.1s; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-outline { padding: 9px 14px; background: none; border: 0.5px solid var(--border2); color: var(--text); font-size: 13px; border-radius: var(--radius-sm); transition: background 0.15s; }
  .btn-outline:hover { background: var(--surface2); }
  .btn-green { width: 100%; padding: 14px; background: var(--green); border: none; color: #0f0f11; font-size: 15px; font-weight: 700; border-radius: var(--radius-sm); transition: opacity 0.15s, transform 0.1s; }
  .btn-green:hover { opacity: 0.88; }
  .btn-green:active { transform: scale(0.98); }

  .rate-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rate-note { font-size: 11px; color: var(--faint); margin-top: 8px; }

  .type-toggle { display: flex; gap: 6px; margin-bottom: 14px; }
  .type-btn { flex: 1; padding: 9px 8px; font-size: 13px; font-weight: 500; font-family: var(--font); border-radius: var(--radius-sm); border: 0.5px solid var(--border2); background: var(--surface2); color: var(--muted); cursor: pointer; transition: all 0.15s; text-align: center; }
  .type-btn.active-shared { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-light); }
  .type-btn.active-personal { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }

  .exclude-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .excl-chip { display: flex; align-items: center; gap: 5px; padding: 5px 10px 5px 6px; border-radius: 20px; border: 0.5px solid var(--border2); background: var(--surface2); font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; transition: all 0.15s; }
  .excl-chip.excluded { background: var(--red-bg); border-color: var(--red); color: var(--red); }
  .excl-chip.is-payer { opacity: 0.4; pointer-events: none; }
  .excl-chip .ea { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; }
  .excl-note { font-size: 11px; color: var(--faint); margin-top: 6px; }

  .expense-list { display: flex; flex-direction: column; gap: 8px; }
  .exp-item { display: flex; align-items: center; gap: 12px; background: var(--surface2); border-radius: var(--radius-sm); padding: 12px; border: 0.5px solid var(--border); }
  .exp-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .exp-info { flex: 1; min-width: 0; }
  .exp-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exp-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .exp-right { text-align: right; flex-shrink: 0; }
  .exp-krw { font-size: 14px; font-weight: 500; font-family: var(--mono); }
  .exp-orig { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .del-btn { background: none; border: none; color: var(--faint); font-size: 18px; padding: 0 0 0 8px; flex-shrink: 0; line-height: 1; }
  .del-btn:hover { color: var(--red); }
  .empty { text-align: center; padding: 32px 0; color: var(--faint); font-size: 13px; }

  .list-filter { display: flex; gap: 6px; margin-bottom: 12px; }
  .filter-btn { padding: 6px 12px; font-size: 12px; font-weight: 500; font-family: var(--font); border-radius: 20px; border: 0.5px solid var(--border2); background: var(--surface2); color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .filter-btn.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-light); }

  .total-banner { background: var(--surface2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
  .tb-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .tb-value { font-size: 26px; font-weight: 700; font-family: var(--mono); color: var(--text); }

  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .metric { border-radius: var(--radius-sm); padding: 12px 14px; }
  .metric.shared-metric { background: var(--accent-bg); border: 0.5px solid rgba(124,108,250,0.25); }
  .metric.personal-metric { background: var(--amber-bg); border: 0.5px solid rgba(245,166,35,0.25); }
  .metric-label { font-size: 11px; color: var(--muted); }
  .metric-value { font-size: 18px; font-weight: 700; font-family: var(--mono); color: var(--text); margin-top: 3px; }
  .metric-sub { font-size: 11px; color: var(--faint); margin-top: 2px; }

  .divider { height: 0.5px; background: var(--border); margin: 12px 0; }

  .per-row { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .per-row-left .pr-label { font-size: 13px; color: var(--muted); }
  .per-row-left .pr-note { font-size: 11px; color: var(--faint); margin-top: 3px; }
  .per-row-right { text-align: right; }
  .per-row-right .pr-value { font-size: 20px; font-weight: 700; font-family: var(--mono); color: var(--green); }
  .per-row-right .pr-sub { font-size: 11px; color: var(--faint); margin-top: 2px; }

  .settle-list { display: flex; flex-direction: column; gap: 8px; }
  .settle-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface2); border-radius: var(--radius-sm); padding: 12px 14px; gap: 8px; }
  .settle-names { font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .settle-arrow { color: var(--faint); }
  .settle-amt { font-size: 14px; font-weight: 500; font-family: var(--mono); color: var(--red); }

  .cur-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.04em; }
  .cur-jpy { background: #2a1f3d; color: #c8aef8; }
  .cur-usd { background: #1a2e1a; color: #6bcf8a; }
  .cur-eur { background: #1a2235; color: #6aabf7; }
  .cur-krw { background: #2a2015; color: #f0c462; }
  .type-badge { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
  .type-badge.personal { background: var(--amber-bg); color: var(--amber); }
  .type-badge.shared { background: var(--accent-bg); color: var(--accent-light); }

  select option { background: #1a1a1f; }
</style>
</head>
<body>

<div class="app-header">
  <h1>여행 정산 <span>✈</span></h1>
  <p class="header-sub" id="header-sub">멤버 0명 · 지출 0건</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('members')">멤버</button>
  <button class="tab" onclick="switchTab('add')">지출 추가</button>
  <button class="tab" onclick="switchTab('list')">내역</button>
  <button class="tab" onclick="switchTab('settle')">정산</button>
</div>

<div class="scroll-area">

  <!-- 멤버 탭 -->
  <div id="tab-members">
    <div class="card">
      <div class="card-title">멤버 관리</div>
      <div class="members-wrap" id="members-row"></div>
      <div class="input-row">
        <input type="text" id="new-member" placeholder="이름 입력 (예: 지민)" maxlength="10" />
        <button class="btn-outline" onclick="addMember()">추가</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">환율 설정 (1 외화 → 원화)</div>
      <div class="rate-grid">
        <div>
          <label class="form-label">🇯🇵 JPY (엔)</label>
          <input type="number" id="rate-jpy" value="9.2" step="0.01" min="0.01" />
        </div>
        <div>
          <label class="form-label">🇺🇸 USD (달러)</label>
          <input type="number" id="rate-usd" value="1380" step="1" min="1" />
        </div>
        <div>
          <label class="form-label">🇪🇺 EUR (유로)</label>
          <input type="number" id="rate-eur" value="1520" step="1" min="1" />
        </div>
        <div>
          <label class="form-label">🇰🇷 KRW (원화)</label>
          <input type="number" value="1" disabled />
        </div>
      </div>
      <p class="rate-note">환율은 직접 수정할 수 있어요.</p>
    </div>
  </div>

  <!-- 지출 추가 탭 -->
  <div id="tab-add" style="display:none;">
    <div class="card">
      <div class="card-title">지출 추가</div>

      <div class="form-label">지출 유형</div>
      <div class="type-toggle">
        <button class="type-btn active-shared" id="type-shared" onclick="setType('shared')">👥 공동 지출</button>
        <button class="type-btn" id="type-personal" onclick="setType('personal')">🙋 개인 지출</button>
      </div>

      <div class="form-single">
        <label class="form-label">항목 이름</label>
        <input type="text" id="exp-name" placeholder="예: 라멘, 지하철, 쇼핑..." />
      </div>
      <div class="form-grid">
        <div>
          <label class="form-label">금액</label>
          <input type="number" id="exp-amount" placeholder="0" min="0" inputmode="decimal" />
        </div>
        <div>
          <label class="form-label">화폐</label>
          <select id="exp-currency">
            <option value="JPY">JPY — 엔</option>
            <option value="USD">USD — 달러</option>
            <option value="EUR">EUR — 유로</option>
            <option value="KRW">KRW — 원화</option>
          </select>
        </div>
      </div>
      <div class="form-single">
        <label class="form-label">결제한 사람</label>
        <select id="exp-payer" onchange="onPayerChange()"></select>
      </div>

      <div id="exclude-section" class="form-single">
        <label class="form-label">제외할 멤버 — 탭하면 제외돼요</label>
        <div class="exclude-wrap" id="exclude-wrap"></div>
        <p class="excl-note" id="excl-note">모든 멤버가 포함돼요.</p>
      </div>

      <div class="form-single">
        <label class="form-label">메모 (선택)</label>
        <input type="text" id="exp-memo" placeholder="추가 메모..." />
      </div>
      <button class="btn-primary" onclick="addExpense()">+ 지출 추가</button>
    </div>
  </div>

  <!-- 내역 탭 -->
  <div id="tab-list" style="display:none;">
    <div class="card">
      <div class="card-title">지출 내역</div>
      <div class="list-filter">
        <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">전체</button>
        <button class="filter-btn" id="filter-shared" onclick="setFilter('shared')">공동</button>
        <button class="filter-btn" id="filter-personal" onclick="setFilter('personal')">개인</button>
      </div>
      <div class="expense-list" id="expense-list">
        <div class="empty">아직 지출 내역이 없어요.</div>
      </div>
    </div>
  </div>

  <!-- 정산 탭 -->
  <div id="tab-settle" style="display:none;">
    <div class="card">
      <div class="card-title">지출 요약</div>

      <div class="total-banner">
        <div>
          <div class="tb-label">여행 총 지출</div>
          <div class="tb-value" id="grand-total">₩0</div>
        </div>
        <div style="text-align:right;font-size:12px;color:var(--faint);" id="grand-sub">0건</div>
      </div>

      <div class="metric-grid">
        <div class="metric shared-metric">
          <div class="metric-label">👥 공동 지출</div>
          <div class="metric-value" id="shared-total">₩0</div>
          <div class="metric-sub" id="shared-sub">0건</div>
        </div>
        <div class="metric personal-metric">
          <div class="metric-label">🙋 개인 지출</div>
          <div class="metric-value" id="personal-total">₩0</div>
          <div class="metric-sub" id="personal-sub">0건</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="per-row">
        <div class="per-row-left">
          <div class="pr-label">공동 지출 1인당 부담</div>
          <div class="pr-note" id="per-note">제외된 멤버가 있으면 달라져요</div>
        </div>
        <div class="per-row-right">
          <div class="pr-value" id="per-person">₩0</div>
          <div class="pr-sub" id="member-n">0명 기준</div>
        </div>
      </div>

      <button class="btn-green" onclick="calcSettle()">정산하기</button>
    </div>

    <div class="card" id="settle-section" style="display:none;">
      <div class="card-title">공동 지출 정산 결과</div>
      <div class="settle-list" id="settle-result"></div>
    </div>
  </div>

</div>

<script>
const COLORS = ['#7c6cfa','#3dd68c','#f26c6c','#f5a623','#60c9f8','#f08dbe','#aad15f'];
const DARKS  = ['#2a2050','#1a3028','#3a1a1a','#3a2a0a','#1a2f3a','#3a1f30','#252f10'];

let members = [], expenses = [];
let currentType = 'shared';
let excluded = new Set();
let currentFilter = 'all';

function getRate(c){
  if(c==='JPY') return parseFloat(document.getElementById('rate-jpy').value)||9.2;
  if(c==='USD') return parseFloat(document.getElementById('rate-usd').value)||1380;
  if(c==='EUR') return parseFloat(document.getElementById('rate-eur').value)||1520;
  return 1;
}
function toKRW(a,c){ return Math.round(a*getRate(c)); }
function fmt(n){ return '₩'+Math.round(n).toLocaleString('ko-KR'); }
function init(n){ return n.slice(0,2).toUpperCase(); }
function col(i){ return COLORS[i%COLORS.length]; }
function dark(i){ return DARKS[i%DARKS.length]; }
function curBadge(c){
  const cls={JPY:'cur-jpy',USD:'cur-usd',EUR:'cur-eur',KRW:'cur-krw'}[c]||'';
  return `<span class="cur-badge ${cls}">${c}</span>`;
}

function updateLabel(){
  document.getElementById('header-sub').textContent=`멤버 ${members.length}명 · 지출 ${expenses.length}건`;
}

function setType(type){
  currentType=type;
  excluded.clear();
  document.getElementById('type-shared').className='type-btn'+(type==='shared'?' active-shared':'');
  document.getElementById('type-personal').className='type-btn'+(type==='personal'?' active-personal':'');
  document.getElementById('exclude-section').style.display=type==='shared'?'block':'none';
  renderExcludeChips();
}

function onPayerChange(){
  excluded.delete(parseInt(document.getElementById('exp-payer').value));
  renderExcludeChips();
}

function renderExcludeChips(){
  const wrap=document.getElementById('exclude-wrap');
  if(!wrap) return;
  if(members.length===0){
    wrap.innerHTML='<span style="font-size:12px;color:var(--faint);">멤버를 먼저 추가하세요</span>';
    return;
  }
  const payerIdx=parseInt(document.getElementById('exp-payer').value);
  wrap.innerHTML=members.map((m,i)=>{
    const isExcl=excluded.has(i);
    const isPayer=i===payerIdx;
    return `<div class="excl-chip${isExcl?' excluded':''}${isPayer?' is-payer':''}" onclick="toggleExclude(${i})">
      <div class="ea" style="background:${dark(i)};color:${col(i)};">${init(m)}</div>
      ${m}${isExcl?' 제외':''}${isPayer?' (결제자)':''}
    </div>`;
  }).join('');
  const inclCount=members.length-excluded.size;
  document.getElementById('excl-note').textContent=
    excluded.size===0?'모든 멤버가 포함돼요.':`${inclCount}명이 나눠서 부담해요.`;
}

function toggleExclude(i){
  if(i===parseInt(document.getElementById('exp-payer').value)) return;
  if(excluded.has(i)) excluded.delete(i); else excluded.add(i);
  renderExcludeChips();
}

function renderMembers(){
  const row=document.getElementById('members-row');
  row.innerHTML=members.map((m,i)=>`
    <div class="chip">
      <div class="chip-avatar" style="background:${dark(i)};color:${col(i)};">${init(m)}</div>
      ${m}
      <button class="chip-remove" onclick="removeMember(${i})">×</button>
    </div>`).join('');
  const p=document.getElementById('exp-payer');
  if(p) p.innerHTML=members.length===0
    ?'<option>멤버를 먼저 추가하세요</option>'
    :members.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
  renderExcludeChips();
  updateLabel();
}

function addMember(){
  const inp=document.getElementById('new-member');
  const name=inp.value.trim();
  if(!name||members.includes(name)){inp.value='';return;}
  members.push(name); saveData({ members, expenses }); inp.value=''; renderMembers();
}

function removeMember(i){
  members.splice(i,1);
  expenses=expenses.filter(e=>e.pi!==i).map(e=>({
    ...e,
    pi:e.pi>i?e.pi-1:e.pi,
    included:e.included?e.included.filter(x=>x!==i).map(x=>x>i?x-1:x):null
  }));
  renderMembers(); renderExpenses(); updateSummary();
  saveData({ members, expenses }); 
}

function addExpense(){
  const name=document.getElementById('exp-name').value.trim();
  const amount=parseFloat(document.getElementById('exp-amount').value);
  const cur=document.getElementById('exp-currency').value;
  const pi=parseInt(document.getElementById('exp-payer').value);
  const memo=document.getElementById('exp-memo').value.trim();
  if(!name||!amount||isNaN(pi)||members.length===0){alert('항목 이름, 금액, 결제자를 확인해 주세요.');return;}
  const type=currentType;
  let included=null;
  if(type==='shared'){
    included=members.map((_,i)=>i).filter(i=>!excluded.has(i));
    if(included.length===0){alert('최소 1명 이상 포함돼야 해요.');return;}
  }
  expenses.push({name,amount,cur,pi,memo,type,included,id:Date.now()});
  saveData({ members, expenses });
  document.getElementById('exp-name').value='';
  document.getElementById('exp-amount').value='';
  document.getElementById('exp-memo').value='';
  excluded.clear();
  renderExcludeChips();
  renderExpenses(); updateSummary(); updateLabel(); switchTab('list');
}

function setFilter(f){
  currentFilter=f;
  ['all','shared','personal'].forEach(x=>{
    document.getElementById('filter-'+x).classList.toggle('active',x===f);
  });
  renderExpenses();
}

function renderExpenses(){
  const list=document.getElementById('expense-list');
  const filtered=currentFilter==='all'?expenses:expenses.filter(e=>e.type===currentFilter);
  if(!filtered.length){list.innerHTML='<div class="empty">지출 내역이 없어요.</div>';return;}
  list.innerHTML=filtered.map(e=>{
    const realIdx=expenses.indexOf(e);
    const krw=toKRW(e.amount,e.cur);
    const origSym={JPY:'¥',USD:'$',EUR:'€'}[e.cur]||'';
    const orig=e.cur!=='KRW'?`${origSym}${e.amount.toLocaleString()} ${e.cur}`:'';
    const typeBadge=e.type==='personal'
      ?`<span class="type-badge personal">개인</span>`
      :`<span class="type-badge shared">공동</span>`;
    const exclInfo=e.type==='shared'&&e.included&&e.included.length<members.length
      ?` · ${e.included.length}명 분담`:'';
    return `<div class="exp-item">
      <div class="exp-avatar" style="background:${dark(e.pi)};color:${col(e.pi)};">${init(members[e.pi]||'?')}</div>
      <div class="exp-info">
        <div class="exp-name">${e.name} ${curBadge(e.cur)} ${typeBadge}</div>
        <div class="exp-sub">${members[e.pi]||'?'} 결제${exclInfo}${e.memo?' · '+e.memo:''}</div>
      </div>
      <div class="exp-right">
        <div class="exp-krw">${fmt(krw)}</div>
        ${orig?`<div class="exp-orig">${orig}</div>`:''}
      </div>
      <button class="del-btn" onclick="deleteExpense(${realIdx})">×</button>
    </div>`;
  }).join('');
}

function deleteExpense(idx){expenses.splice(idx,1);renderExpenses();updateSummary();updateLabel();}

function updateSummary(){
  const shared=expenses.filter(e=>e.type==='shared');
  const personal=expenses.filter(e=>e.type==='personal');
  const sharedTotal=shared.reduce((s,e)=>s+toKRW(e.amount,e.cur),0);
  const personalTotal=personal.reduce((s,e)=>s+toKRW(e.amount,e.cur),0);
  const grand=sharedTotal+personalTotal;
  document.getElementById('grand-total').textContent=fmt(grand);
  document.getElementById('grand-sub').textContent=`총 ${expenses.length}건`;
  document.getElementById('shared-total').textContent=fmt(sharedTotal);
  document.getElementById('shared-sub').textContent=`${shared.length}건`;
  document.getElementById('personal-total').textContent=fmt(personalTotal);
  document.getElementById('personal-sub').textContent=`${personal.length}건`;
  const n=members.length;
  if(n>0){
    document.getElementById('per-person').textContent=fmt(sharedTotal/n);
    document.getElementById('member-n').textContent=`${n}명 기준`;
  } else {
    document.getElementById('per-person').textContent='₩0';
    document.getElementById('member-n').textContent='0명';
  }
}

function calcSettle(){
  const shared=expenses.filter(e=>e.type==='shared');
  if(members.length<2){alert('멤버가 2명 이상이어야 해요.');return;}
  if(!shared.length){alert('공동 지출 내역이 없어요.');return;}
  const n=members.length;
  const balance=new Array(n).fill(0);
  shared.forEach(e=>{
    const krw=toKRW(e.amount,e.cur);
    const incl=e.included||members.map((_,i)=>i);
    const share=krw/incl.length;
    balance[e.pi]+=krw;
    incl.forEach(i=>{ balance[i]-=share; });
  });
  let cred=balance.map((b,i)=>({i,b})).filter(x=>x.b>0.5).sort((a,b)=>b.b-a.b);
  let debt=balance.map((b,i)=>({i,b})).filter(x=>x.b<-0.5).sort((a,b)=>a.b-b.b);
  const tx=[];
  let ci=0,di=0;
  while(ci<cred.length&&di<debt.length){
    const amt=Math.min(cred[ci].b,-debt[di].b);
    tx.push({from:debt[di].i,to:cred[ci].i,amt:Math.round(amt)});
    cred[ci].b-=amt; debt[di].b+=amt;
    if(cred[ci].b<0.5)ci++;
    if(-debt[di].b<0.5)di++;
  }
  const res=document.getElementById('settle-result');
  res.innerHTML=tx.length===0
    ?'<div class="empty">모두 동일하게 냈어요!</div>'
    :tx.map(t=>`
      <div class="settle-row">
        <div class="settle-names">
          <span style="color:${col(t.from)};font-weight:700;">${members[t.from]}</span>
          <span class="settle-arrow">→</span>
          <span style="color:${col(t.to)};font-weight:700;">${members[t.to]}</span>
        </div>
        <div class="settle-amt">${fmt(t.amt)}</div>
      </div>`).join('');
  document.getElementById('settle-section').style.display='block';
}

function switchTab(name){
  ['members','add','list','settle'].forEach(t=>{
    document.getElementById('tab-'+t).style.display=t===name?'block':'none';
  });
  document.querySelectorAll('.tab').forEach((btn,i)=>{
    btn.classList.toggle('active',['members','add','list','settle'][i]===name);
  });
  if(name==='settle') updateSummary();
  if(name==='add') renderExcludeChips();
}

document.getElementById('new-member').addEventListener('keydown',e=>{if(e.key==='Enter')addMember();});
setType('shared');
renderMembers();
</script>
